package com.pojavhud;
import com.google.gson.Gson;
import com.google.gson.GsonBuilder;
import com.mojang.brigadier.CommandDispatcher;
import com.mojang.brigadier.arguments.StringArgumentType;
import net.fabricmc.api.ClientModInitializer;
import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
import net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource;
import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
import net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry;
import net.fabricmc.loader.api.FabricLoader;
import net.minecraft.client.MinecraftClient;
import net.minecraft.client.font.TextRenderer;
import net.minecraft.client.gui.Click;
import net.minecraft.client.gui.DrawContext;
import net.minecraft.client.gui.screen.Screen;
import net.minecraft.client.gui.widget.ButtonWidget;
import net.minecraft.client.gui.widget.TextFieldWidget;
import net.minecraft.client.option.KeyBinding;
import net.minecraft.client.util.InputUtil;
import net.minecraft.component.DataComponentTypes;
import net.minecraft.component.type.ItemEnchantmentsComponent;
import net.minecraft.component.type.PotionContentsComponent;
import net.minecraft.enchantment.Enchantment;
import net.minecraft.entity.player.PlayerInventory;
import net.minecraft.item.Item;
import net.minecraft.item.ItemStack;
import net.minecraft.item.Items;
import net.minecraft.registry.DynamicRegistryManager;
import net.minecraft.registry.Registries;
import net.minecraft.registry.RegistryKeys;
import net.minecraft.registry.entry.RegistryEntry;
import net.minecraft.screen.slot.SlotActionType;
import net.minecraft.server.MinecraftServer;
import net.minecraft.server.network.ServerPlayerEntity;
import net.minecraft.text.Text;
import net.minecraft.util.Identifier;
import org.lwjgl.glfw.GLFW;
import org.slf4j.Logger;
import org.slf4j.LoggerFactory;
import java.nio.file.Files;
import java.nio.file.Path;
import java.util.*;
public class PojavHudClient implements ClientModInitializer {
public static final String MOD_ID = "pojavhud";
public static final Logger LOGGER = LoggerFactory.getLogger(MOD_ID);
public static final KeyBinding.Category CATEGORY = KeyBinding.Category.create(Identifier.of(MOD_ID, "main"));
public static KeyBinding toggleKey, editorKey, hideInMenusKey, kitMenuKey;
public static boolean hudVisible = true;
public static boolean editorOpen = false;
public static HudConfig config;
public static Screen pendingScreen = null;
@Override
public void onInitializeClient() {
LOGGER.info("PojavHUD 1.3.0 initializing...");
config = HudConfig.load();
KitManager.load();
KitCommand.register();
toggleKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.pojavhud.toggle", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_N, CATEGORY));
editorKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.pojavhud.editor", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_O, CATEGORY));
hideInMenusKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.pojavhud.hidemenus", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_H, CATEGORY));
kitMenuKey = KeyBindingHelper.registerKeyBinding(new KeyBinding("key.pojavhud.kitmenu", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_UNKNOWN, CATEGORY));
ClientTickEvents.END_CLIENT_TICK.register(client -> {
if (pendingScreen != null) {
Screen target = pendingScreen;
pendingScreen = null;
client.setScreen(target);
}
while (toggleKey.wasPressed()) {
hudVisible = !hudVisible;
if (client.player != null) client.player.sendMessage(Text.literal("§b[PojavHUD] §fHUD: " + (hudVisible ? "§aON" : "§cOFF")), true);
}
while (editorKey.wasPressed()) {
if (client.currentScreen == null) client.setScreen(new EditorScreen());
}
while (hideInMenusKey.wasPressed()) {
config.hideInMenus = !config.hideInMenus;
config.save();
if (client.player != null) client.player.sendMessage(Text.literal("§b[PojavHUD] §fHide in Menus: " + (config.hideInMenus ? "§aON" : "§cOFF")), true);
}
while (kitMenuKey.wasPressed()) {
if (client.currentScreen == null) client.setScreen(new KitScreen(null, null));
}
if (hudVisible && !editorOpen) {
HudRenderer.tick(client);
}
});
HudElementRegistry.addLast(Identifier.of(MOD_ID, "overlay"), (context, tickCounter) -> {
if (hudVisible && !editorOpen) {
HudRenderer.render(context);
}
});
LOGGER.info("PojavHUD 1.3.0 initialized successfully!");
}
}
class HudConfig {
private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
private static final Path PATH = FabricLoader.getInstance().getConfigDir().resolve("pojavhud.json");
public IconConfig[] icons = new IconConfig[9];
public String delayMode = "HIGH";
public float customDelay = 0.5f;
public boolean showItemDecorations = true;
public boolean hideInMenus = false;
public boolean editAllIcons = true;
public HudConfig() {
for (int i = 0; i < 9; i++) {
icons[i] = new IconConfig();
icons[i].x = 0.35f + i * 0.04f;
}
}
public static class IconConfig {
public float x = 0.5f, y = 0.5f, scale = 1.0f, opacity = 1.0f;
}
public long getDelayMs() {
return switch (delayMode == null ? "HIGH" : delayMode) {
case "OFF" -> 0L;
case "MEDIUM" -> 900L;
case "LOW" -> 1200L;
case "CUSTOM" -> (long) (Math.max(0f, customDelay) * 1000f);
default -> 300L;
};
}
public void cycleDelayMode() {
delayMode = switch (delayMode == null ? "HIGH" : delayMode) {
case "OFF" -> "HIGH";
case "HIGH" -> "MEDIUM";
case "MEDIUM" -> "LOW";
case "LOW" -> "CUSTOM";
default -> "OFF";
};
save();
}
public String getDelayButtonText() {
return switch (delayMode == null ? "HIGH" : delayMode) {
case "OFF" -> "Opt: Off (0s)";
case "MEDIUM" -> "Opt: Med (0.9s)";
case "LOW" -> "Opt: Low (1.2s)";
case "CUSTOM" -> "Opt: Custom";
default -> "Opt: High (0.3s)";
};
}
public static HudConfig load() {
try {
if (Files.exists(PATH)) {
HudConfig c = GSON.fromJson(Files.readString(PATH), HudConfig.class);
if (c != null && c.icons != null && c.icons.length == 9) return c;
}
} catch (Exception ignored) {}
HudConfig c = new HudConfig();
c.save();
return c;
}
public void save() {
try {
Files.createDirectories(PATH.getParent());
Files.writeString(PATH, GSON.toJson(this));
} catch (Exception ignored) {}
}
public void reset() {
HudConfig d = new HudConfig();
this.icons = d.icons;
this.delayMode = d.delayMode;
this.customDelay = d.customDelay;
this.showItemDecorations = d.showItemDecorations;
this.hideInMenus = d.hideInMenus;
this.editAllIcons = d.editAllIcons;
HudRenderer.markLayoutDirty();
save();
}
}
class HudRenderer {
private static final ItemStack[] displayed = new ItemStack[9];
private static final Item[] pending = new Item[9];
private static final long[] timestamps = new long[9];
private static final int[] cX = new int[9], cY = new int[9], cSize = new int[9];
private static final float[] cCX = new float[9], cCY = new float[9];
private static int lastW = -1, lastH = -1;
private static boolean dirty = true;
static {
Arrays.fill(displayed, ItemStack.EMPTY);
Arrays.fill(pending, Items.AIR);
}
public static void markLayoutDirty() { dirty = true; }
public static void tick(MinecraftClient client) {
if (client == null || client.player == null) return;
PlayerInventory inv = client.player.getInventory();
long now = System.currentTimeMillis(), delay = PojavHudClient.config.getDelayMs();
for (int i = 0; i < 9; i++) {
var ic = PojavHudClient.config.icons[i];
ItemStack cur = inv.getStack(i);
if (ic == null || ic.opacity <= 0.01f || cur == null || cur.isEmpty()) {
displayed[i] = ItemStack.EMPTY;
pending[i] = Items.AIR;
continue;
}
if (delay <= 0L) {
displayed[i] = cur;
pending[i] = cur.getItem();
} else {
if (cur.getItem() != pending[i]) {
pending[i] = cur.getItem();
timestamps[i] = now;
}
if (now - timestamps[i] >= delay) displayed[i] = cur;
}
}
}
public static void render(DrawContext ctx) {
MinecraftClient client = MinecraftClient.getInstance();
if (client == null || client.player == null || client.options.hudHidden) return;
if (PojavHudClient.config.hideInMenus && client.currentScreen != null) return;
int sw = client.getWindow().getScaledWidth(), sh = client.getWindow().getScaledHeight();
var icons = PojavHudClient.config.icons;
if (dirty || sw != lastW || sh != lastH) {
for (int i = 0; i < 9; i++) {
cSize[i] = (int) (16 * icons[i].scale);
cX[i] = (int) (icons[i].x * sw) - cSize[i] / 2;
cY[i] = (int) (icons[i].y * sh) - cSize[i] / 2;
cCX[i] = cX[i] + cSize[i] * 0.5f;
cCY[i] = cY[i] + cSize[i] * 0.5f;
}
lastW = sw; lastH = sh; dirty = false;
}
var m = ctx.getMatrices();
for (int i = 0; i < 9; i++) {
if (icons[i].opacity <= 0.01f || displayed[i].isEmpty()) continue;
m.pushMatrix();
m.translate(cCX[i], cCY[i]);
m.scale(icons[i].scale, icons[i].scale);
m.translate(-8f, -8f);
ctx.drawItem(displayed[i], 0, 0);
m.popMatrix();
}
TextRenderer tr = client.textRenderer;
for (int i = 0; i < 9; i++) {
if (icons[i].opacity <= 0.01f || displayed[i].isEmpty()) continue;
if (PojavHudClient.config.showItemDecorations && tr != null) {
m.pushMatrix();
m.translate(cCX[i], cCY[i]);
m.scale(icons[i].scale, icons[i].scale);
m.translate(-8f, -8f);
ctx.drawStackOverlay(tr, displayed[i], 0, 0);
m.popMatrix();
}
if (icons[i].opacity < 0.99f) {
int a = Math.min(220, Math.max(0, (int) ((1f - icons[i].opacity) * 220f)));
ctx.fill(cX[i], cY[i], cX[i] + cSize[i], cY[i] + cSize[i], a << 24);
}
}
}
}
class EditorScreen extends Screen {
private int sel = 0;
private boolean drag = false, resize = false;
private double offX, offY;
private TextFieldWidget delayField;
public EditorScreen() {
super(Text.literal("PojavHUD Editor"));
PojavHudClient.editorOpen = true;
}
@Override
protected void init() {
int y = this.height - 26;
this.addDrawableChild(ButtonWidget.builder(Text.literal("§e★ Kits Menu"), b -> this.client.setScreen(new KitScreen(this, null))).dimensions(this.width - 95, 8, 85, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal(tgtText()), b -> {
PojavHudClient.config.editAllIcons = !PojavHudClient.config.editAllIcons;
b.setMessage(Text.literal(tgtText()));
PojavHudClient.config.save();
}).dimensions(this.width - 185, 8, 85, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Reset"), b -> {
PojavHudClient.config.reset();
this.clearAndInit();
}).dimensions(8, y, 42, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Save"), b -> {
PojavHudClient.config.save();
this.close();
}).dimensions(54, y, 42, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal(PojavHudClient.config.getDelayButtonText()), b -> {
PojavHudClient.config.cycleDelayMode();
b.setMessage(Text.literal(PojavHudClient.config.getDelayButtonText()));
delayField.setVisible("CUSTOM".equals(PojavHudClient.config.delayMode));
}).dimensions(100, y, 88, 20).build());
delayField = new TextFieldWidget(this.textRenderer, 192, y, 36, 20, Text.literal("Delay"));
delayField.setText(String.valueOf(PojavHudClient.config.customDelay));
delayField.setVisible("CUSTOM".equals(PojavHudClient.config.delayMode));
delayField.setChangedListener(t -> { try { PojavHudClient.config.customDelay = Math.max(0f, Float.parseFloat(t.trim())); } catch (Exception ignored) {} });
this.addDrawableChild(delayField);
this.addDrawableChild(ButtonWidget.builder(Text.literal("Count: " + (PojavHudClient.config.showItemDecorations ? "ON" : "OFF")), b -> {
PojavHudClient.config.showItemDecorations = !PojavHudClient.config.showItemDecorations;
b.setMessage(Text.literal("Count: " + (PojavHudClient.config.showItemDecorations ? "ON" : "OFF")));
PojavHudClient.config.save();
}).dimensions(232, y, 68, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Size+"), b -> scale(0.1f)).dimensions(304, y, 35, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Size-"), b -> scale(-0.1f)).dimensions(342, y, 35, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Op+"), b -> op(0.1f)).dimensions(380, y, 30, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Op-"), b -> op(-0.1f)).dimensions(413, y, 30, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Prev"), b -> sel = (sel + 8) % 9).dimensions(this.width - 96, y, 42, 20).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Next"), b -> sel = (sel + 1) % 9).dimensions(this.width - 50, y, 42, 20).build());
}
private String tgtText() { return PojavHudClient.config.editAllIcons ? "Target: ALL" : "Target: ONE"; }
private void scale(float d) {
for (int i = 0; i < 9; i++) if (PojavHudClient.config.editAllIcons || i == sel)
PojavHudClient.config.icons[i].scale = Math.max(0.5f, Math.min(4.0f, PojavHudClient.config.icons[i].scale + d));
HudRenderer.markLayoutDirty();
PojavHudClient.config.save();
}
private void op(float d) {
for (int i = 0; i < 9; i++) if (PojavHudClient.config.editAllIcons || i == sel)
PojavHudClient.config.icons[i].opacity = Math.max(0.1f, Math.min(1.0f, PojavHudClient.config.icons[i].opacity + d));
PojavHudClient.config.save();
}
@Override
public void render(DrawContext ctx, int mx, int my, float delta) {
ctx.fill(0, 0, this.width, this.height, 0x80000000);
super.render(ctx, mx, my, delta);
var icons = PojavHudClient.config.icons;
var inv = (client != null && client.player != null) ? client.player.getInventory() : null;
ctx.drawText(this.textRenderer, "Selected: Icon " + (sel + 1) + " | " + tgtText(), 10, 10, 0xFFFFFF, false);
ctx.drawText(this.textRenderer, String.format("Pos:(%.2f, %.2f) Scale:%.1f Op:%.0f%%", icons[sel].x, icons[sel].y, icons[sel].scale, icons[sel].opacity * 100f), 10, 22, 0xCCCCCC, false);
for (int i = 0; i < 9; i++) {
var ic = icons[i];
int s = Math.max(8, (int) (16 * ic.scale));
int x = (int) (ic.x * this.width) - s / 2, y = (int) (ic.y * this.height) - s / 2;
ctx.fill(x - 2, y - 2, x + s + 2, y + s + 2, i == sel ? 0x80FFFF00 : 0x40000000);
ItemStack st = inv != null ? inv.getStack(i) : ItemStack.EMPTY;
if (st != null && !st.isEmpty()) {
var m = ctx.getMatrices();
m.pushMatrix();
m.translate(x + s / 2f, y + s / 2f);
m.scale(ic.scale, ic.scale);
m.translate(-8f, -8f);
ctx.drawItem(st, 0, 0);
if (PojavHudClient.config.showItemDecorations) ctx.drawStackOverlay(this.textRenderer, st, 0, 0);
m.popMatrix();
} else {
ctx.drawCenteredTextWithShadow(this.textRenderer, String.valueOf(i + 1), x + s / 2, y + s / 2 - 4, 0x888888);
}
if (ic.opacity < 0.99f) ctx.fill(x, y, x + s, y + s, ((int) ((1f - ic.opacity) * 210f)) << 24);
if (i == sel) ctx.fill(x + s - 8, y + s - 8, x + s, y + s, 0xFFFFFFFF);
}
}
@Override
public boolean mouseClicked(Click click, boolean doubled) {
if (super.mouseClicked(click, doubled)) return true;
double mx = click.x(), my = click.y();
if (click.button() == 0) {
for (int idx = 0; idx < 9; idx++) {
int i = (idx == 0) ? sel : (idx <= sel ? idx - 1 : idx);
var ic = PojavHudClient.config.icons[i];
int s = Math.max(8, (int) (16 * ic.scale));
int x = (int) (ic.x * this.width) - s / 2, y = (int) (ic.y * this.height) - s / 2;
if (i == sel && mx >= x + s - 8 && mx <= x + s && my >= y + s - 8 && my <= y + s) {
resize = true; return true;
}
if (mx >= x && mx <= x + s && my >= y && my <= y + s) {
sel = i; drag = true;
offX = mx - ic.x * this.width; offY = my - ic.y * this.height;
return true;
}
}
}
return false;
}
@Override
public boolean mouseReleased(Click click) {
drag = false; resize = false;
HudRenderer.markLayoutDirty();
PojavHudClient.config.save();
return super.mouseReleased(click);
}
@Override
public boolean mouseDragged(Click click, double dx, double dy) {
var ic = PojavHudClient.config.icons[sel];
if (drag) {
ic.x = Math.max(0f, Math.min(1f, (float) ((click.x() - offX) / this.width)));
ic.y = Math.max(0f, Math.min(1f, (float) ((click.y() - offY) / this.height)));
HudRenderer.markLayoutDirty();
return true;
}
if (resize) {
double d = Math.max(Math.abs(click.x() - ic.x * this.width), Math.abs(click.y() - ic.y * this.height));
ic.scale = (float) Math.max(0.5, Math.min(4.0, d / 8.0));
HudRenderer.markLayoutDirty();
return true;
}
return super.mouseDragged(click, dx, dy);
}
@Override
public void close() {
PojavHudClient.editorOpen = false;
HudRenderer.markLayoutDirty();
PojavHudClient.config.save();
super.close();
}
@Override
public boolean shouldPause() { return false; }
}
class KitManager {
private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
private static final Path PATH = FabricLoader.getInstance().getConfigDir().resolve("pojavhud_kits.json");
public static KitConfigFile data = new KitConfigFile();
public static class KitConfigFile {
public boolean clearOnLoad = true;
public String loadMode = "HYBRID";
public LinkedHashMap<String, KitData> kits = new LinkedHashMap<>();
}
public static class KitData {
public String name, description;
public List<SlotItemData> items = new ArrayList<>();
public KitData() {}
public KitData(String n, String d) { name = n; description = d; }
public KitData add(int slot, String id, int count, String enchOrPot) {
SlotItemData s = new SlotItemData(slot, id.contains(":") ? id : "minecraft:" + id, count);
if (enchOrPot != null && !enchOrPot.isEmpty()) {
for (String part : enchOrPot.split(",")) {
if (part.startsWith("pot:")) s.potionId = part.substring(4);
else if (part.contains(":")) {
String[] kv = part.split(":");
s.enchantments.put(kv[0], Integer.parseInt(kv[1]));
}
}
}
items.add(s);
return this;
}
public KitData fill(int from, int to, String id, int count, String enchOrPot) {
for (int i = from; i <= to; i++) add(i, id, count, enchOrPot);
return this;
}
}
public static class SlotItemData {
public int slot, count = 1, damage = 0;
public String itemId, customName = null, potionId = null;
public LinkedHashMap<String, Integer> enchantments = new LinkedHashMap<>();
public SlotItemData() {}
public SlotItemData(int s, String id, int c) { slot = s; itemId = id; count = c; }
}
public static void load() {
try {
if (Files.exists(PATH)) {
KitConfigFile f = GSON.fromJson(Files.readString(PATH), KitConfigFile.class);
if (f != null && f.kits != null && !f.kits.isEmpty()) { data = f; return; }
}
} catch (Exception ignored) {}
resetDefaultKits();
}
public static void save() {
try {
Files.createDirectories(PATH.getParent());
Files.writeString(PATH, GSON.toJson(data));
} catch (Exception ignored) {}
}
public static void cycleLoadMode() {
data.loadMode = switch (data.loadMode == null ? "HYBRID" : data.loadMode) {
case "HYBRID" -> "SORTER";
case "SORTER" -> "OP_CMD";
default -> "HYBRID";
};
save();
}
