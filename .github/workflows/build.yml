public static ItemStack createStack(SlotItemData s, DynamicRegistryManager reg) {
if (s == null || s.itemId == null) return ItemStack.EMPTY;
Identifier id = Identifier.tryParse(s.itemId.contains(":") ? s.itemId : "minecraft:" + s.itemId);
if (id == null) return ItemStack.EMPTY;
Item item = Registries.ITEM.get(id);
if (item == Items.AIR) return ItemStack.EMPTY;
ItemStack st = new ItemStack(item, Math.max(1, Math.min(99, s.count)));
if (s.damage > 0 && st.isDamageable()) st.setDamage(s.damage);
if (s.customName != null && !s.customName.isEmpty()) st.set(DataComponentTypes.CUSTOM_NAME, Text.literal(s.customName));
if (s.potionId != null && !s.potionId.isEmpty()) {
String p = s.potionId.replace("minecraft:", "");
Registries.POTION.streamEntries().filter(e -> e.registryKey().getValue().getPath().equals(p)).findFirst()
.ifPresent(e -> st.set(DataComponentTypes.POTION_CONTENTS, new PotionContentsComponent(e)));
}
if (s.enchantments != null && reg != null) {
try {
var er = reg.getOrThrow(RegistryKeys.ENCHANTMENT);
s.enchantments.forEach((k, lvl) -> er.streamEntries()
.filter(e -> e.registryKey().getValue().getPath().equals(k.replace("minecraft:", ""))).findFirst()
.ifPresent(e -> st.addEnchantment(e, lvl)));
} catch (Exception ignored) {}
}
return st;
}
public static String saveCurrentInventoryAsKit(MinecraftClient client, String rawName) {
if (client == null || client.player == null) return "§cMust be in a world!";
String key = rawName == null ? "" : rawName.trim().toLowerCase(Locale.ROOT);
if (key.isEmpty()) return "§cEnter a valid kit name!";
PlayerInventory inv = client.player.getInventory();
KitData kit = new KitData(key, "Custom Saved Kit (" + key + ")");
for (int slot = 0; slot <= 40; slot++) {
ItemStack st = inv.getStack(slot);
if (st == null || st.isEmpty()) continue;
SlotItemData sd = new SlotItemData(slot, Registries.ITEM.getId(st.getItem()).toString(), st.getCount());
if (st.isDamaged()) sd.damage = st.getDamage();
if (st.getCustomName() != null) sd.customName = st.getCustomName().getString();
PotionContentsComponent pc = st.get(DataComponentTypes.POTION_CONTENTS);
if (pc != null && pc.potion().isPresent()) pc.potion().get().getKey().ifPresent(k -> sd.potionId = k.getValue().getPath());
ItemEnchantmentsComponent ec = st.getEnchantments();
if (ec != null) for (RegistryEntry<Enchantment> e : ec.getEnchantments()) e.getKey().ifPresent(k -> sd.enchantments.put(k.getValue().getPath(), ec.getLevel(e)));
kit.items.add(sd);
}
data.kits.put(key, kit);
save();
return "§aSaved kit '§e" + key + "§a' (" + kit.items.size() + " slots)!";
}
public static String loadKit(MinecraftClient client, String rawName) {
if (client == null || client.player == null || client.world == null) return "§cMust be in a world!";
String key = rawName == null ? "" : rawName.trim().toLowerCase(Locale.ROOT);
KitData kit = data.kits.get(key);
if (kit == null) return "§cKit '" + key + "' not found!";
if ("SORTER".equals(data.loadMode)) return "§a[Sorter] Swapped §e" + sortInv(client, kit) + "§a slots!";
if ("OP_CMD".equals(data.loadMode)) return "§a[OP Mode] Sent §e" + sendOp(client, kit) + "§a commands!";
MinecraftServer srv = client.getServer();
if (srv != null) {
UUID uuid = client.player.getUuid();
srv.execute(() -> {
ServerPlayerEntity sp = srv.getPlayerManager().getPlayer(uuid);
if (sp != null) {
if (data.clearOnLoad) for (int i = 0; i <= 40; i++) sp.getInventory().setStack(i, ItemStack.EMPTY);
for (SlotItemData item : kit.items) sp.getInventory().setStack(item.slot, createStack(item, sp.getRegistryManager()));
sp.playerScreenHandler.sendContentUpdates();
}
});
return "§a[Singleplayer] Equipped kit '§e" + key + "§a'!";
}
if (client.player.isCreative() && client.interactionManager != null) {
var reg = client.world.getRegistryManager();
if (data.clearOnLoad) for (int i = 0; i <= 40; i++) {
client.player.getInventory().setStack(i, ItemStack.EMPTY);
int p = pktSlot(i);
if (p != -1) client.interactionManager.clickCreativeStack(ItemStack.EMPTY, p);
}
for (SlotItemData item : kit.items) {
ItemStack st = createStack(item, reg);
client.player.getInventory().setStack(item.slot, st.copy());
int p = pktSlot(item.slot);
if (p != -1) client.interactionManager.clickCreativeStack(st, p);
}
return "§a[Creative] Equipped kit '§e" + key + "§a'!";
}
int sorted = sortInv(client, kit);
return sorted > 0 ? "§a[Hybrid Sorter] Sorted §e" + sorted + "§a slots!" : "§e[Hybrid OP] Sent §f" + sendOp(client, kit) + "§e /item commands!";
}
private static int pktSlot(int s) {
if (s >= 0 && s <= 8) return s + 36;
if (s >= 9 && s <= 35) return s;
return switch (s) { case 39 -> 5; case 38 -> 6; case 37 -> 7; case 36 -> 8; case 40 -> 45; default -> -1; };
}
private static int sortInv(MinecraftClient c, KitData kit) {
if (c.player == null || c.interactionManager == null) return 0;
PlayerInventory inv = c.player.getInventory();
int sync = c.player.playerScreenHandler.syncId, swaps = 0;
for (SlotItemData t : kit.items) {
if (t.slot < 0 || t.slot > 35) continue;
Item wanted = Registries.ITEM.get(Identifier.tryParse(t.itemId));
if (wanted == Items.AIR || inv.getStack(t.slot).isOf(wanted)) continue;
for (int scan = 0; scan <= 35; scan++) {
if (scan != t.slot && inv.getStack(scan).isOf(wanted)) {
int fp = pktSlot(scan), tp = pktSlot(t.slot);
c.interactionManager.clickSlot(sync, fp, 0, SlotActionType.PICKUP, c.player);
c.interactionManager.clickSlot(sync, tp, 0, SlotActionType.PICKUP, c.player);
c.interactionManager.clickSlot(sync, fp, 0, SlotActionType.PICKUP, c.player);
swaps++; break;
}
}
}
return swaps;
}
private static int sendOp(MinecraftClient c, KitData kit) {
if (c.player == null || c.player.networkHandler == null) return 0;
if (data.clearOnLoad) c.player.networkHandler.sendChatCommand("clear");
int sent = 0;
for (SlotItemData it : kit.items) {
String sn = it.slot <= 8 ? "hotbar." + it.slot : it.slot <= 35 ? "inventory." + (it.slot - 9) :
switch (it.slot) { case 39 -> "armor.head"; case 38 -> "armor.chest"; case 37 -> "armor.legs"; case 36 -> "armor.feet"; case 40 -> "weapon.offhand"; default -> null; };
if (sn == null) continue;
c.player.networkHandler.sendChatCommand("item replace entity @s " + sn + " with " + it.itemId + " " + Math.max(1, it.count));
sent++;
}
return sent;
}
}
class KitCommand {
public static void register() {
ClientCommandRegistrationCallback.EVENT.register((dispatcher, reg) -> {
for (String cmd : new String[]{"kit", "pkit", "mkit"}) regAlias(dispatcher, cmd);
});
}
private static void regAlias(CommandDispatcher<FabricClientCommandSource> d, String lit) {
d.register(ClientCommandManager.literal(lit)
.executes(c -> { PojavHudClient.pendingScreen = new KitScreen(null, null); return 1; })
.then(ClientCommandManager.literal("preview")
.executes(c -> { PojavHudClient.pendingScreen = new KitScreen(null, null); return 1; })
.then(ClientCommandManager.argument("name", StringArgumentType.word())
.executes(c -> { PojavHudClient.pendingScreen = new KitScreen(null, StringArgumentType.getString(c, "name")); return 1; })))
.then(ClientCommandManager.literal("save").then(ClientCommandManager.argument("name", StringArgumentType.word())
.executes(c -> { c.getSource().sendFeedback(Text.literal("§b[PojavKit] " + KitManager.saveCurrentInventoryAsKit(c.getSource().getClient(), StringArgumentType.getString(c, "name")))); return 1; })))
.then(ClientCommandManager.literal("load").then(ClientCommandManager.argument("name", StringArgumentType.word())
.executes(c -> { c.getSource().sendFeedback(Text.literal("§b[PojavKit] " + KitManager.loadKit(c.getSource().getClient(), StringArgumentType.getString(c, "name")))); return 1; })))
.then(ClientCommandManager.literal("delete").then(ClientCommandManager.argument("name", StringArgumentType.word())
.executes(c -> {
String n = StringArgumentType.getString(c, "name").toLowerCase(Locale.ROOT);
boolean ok = KitManager.data.kits.remove(n) != null;
if (ok) KitManager.save();
c.getSource().sendFeedback(Text.literal("§b[PojavKit] " + (ok ? "§aDeleted " + n : "§cNot found")));
return 1;
})))
.then(ClientCommandManager.literal("list").executes(c -> {
c.getSource().sendFeedback(Text.literal("§b[PojavKit] §fKits: §e" + String.join(", ", KitManager.data.kits.keySet())));
return 1;
}))
.then(ClientCommandManager.literal("reset").executes(c -> {
KitManager.resetDefaultKits();
c.getSource().sendFeedback(Text.literal("§b[PojavKit] §aRestored 6 default PvP kits!"));
return 1;
})));
}
public static String executeFromMenu(MinecraftClient client, String raw, KitScreen scr) {
if (raw == null || raw.trim().isEmpty()) return "§cEnter a command!";
String clean = raw.trim().startsWith("/") ? raw.trim().substring(1).trim() : raw.trim();
String[] p = clean.split("\s+");
String r = p[0].toLowerCase(Locale.ROOT);
if (r.equals("kit") || r.equals("pkit") || r.equals("mkit")) {
if (p.length < 2) return "§aSubcommands: load, save, preview, list, delete, reset";
String sub = p[1].toLowerCase(Locale.ROOT), arg = p.length >= 3 ? p[2].toLowerCase(Locale.ROOT) : null;
return switch (sub) {
case "load" -> arg != null ? KitManager.loadKit(client, arg) : "§cUsage: /kit load <name>";
case "save" -> { String m = KitManager.saveCurrentInventoryAsKit(client, arg); if (scr != null && arg != null) scr.selectKit(arg); yield m; }
case "preview" -> { if (scr != null && arg != null) scr.selectKit(arg); yield "§aPreviewing " + (arg != null ? arg : "kit"); }
case "delete" -> { if (arg != null && KitManager.data.kits.remove(arg) != null) { KitManager.save(); if (scr != null) scr.refresh(); yield "§aDeleted " + arg; } yield "§cNot found"; }
case "reset" -> { KitManager.resetDefaultKits(); if (scr != null) scr.refresh(); yield "§aRestored 6 default kits!"; }
case "list" -> "§fKits: §e" + String.join(", ", KitManager.data.kits.keySet());
default -> "§cUnknown subcommand: " + sub;
};
}
if (client != null && client.player != null && client.player.networkHandler != null) {
client.player.networkHandler.sendChatCommand(clean);
return "§aRan server command: §e/" + clean;
}
return "§cJoin a world to run server commands!";
}
}
