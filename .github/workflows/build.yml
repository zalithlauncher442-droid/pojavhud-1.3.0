name: Build PojavHUD 1.3.0 Jar
​on:
push:
pull_request:
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Generate PojavHUD 1.3.0 Source and Assets
run: |
python3 - << 'PYEOF'
import os, struct, zlib, math
​os.makedirs("src/main/java/com/pojavhud", exist_ok=True)
os.makedirs("src/main/resources/assets/pojavhud/lang", exist_ok=True)
​with open("settings.gradle", "w") as f:
f.write("""pluginManagement {
repositories {
maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
mavenCentral()
gradlePluginPortal()
}
}
""")
​with open("gradle.properties", "w") as f:
f.write("""org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.18.4
loom_version=1.14-SNAPSHOT
version=1.3.0
group=com.pojavhud
archives_base_name=pojavhud-1.21.9-1.21.11
fabric_api_version=0.141.3+1.21.11
modmenu_version=17.0.0-beta.1
""".replace("        ", ""))
​with open("build.gradle", "w") as f:
f.write("""plugins {
id 'fabric-loom' version "{loom_version}"
id 'maven-publish'
}
version = project.version
group = project.group
base { archivesName = project.archives_base_name }
repositories {
maven { url = "https://maven.terraformersmc.com/releases/" }
maven { url = "https://maven.fabricmc.net/" }
mavenCentral()
}
dependencies {
minecraft "com.mojang:minecraft:{project.minecraft_version}"
mappings "net.fabricmc:yarn:{project.yarn_mappings}:v2"
modImplementation "net.fabricmc:fabric-loader:{project.loader_version}"
modImplementation "net.fabricmc.fabric-api:fabric-api:{project.fabric_api_version}"
modCompileOnly "com.terraformersmc:modmenu:{project.modmenu_version}"
}
processResources {
inputs.property "version", project.version
filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
withSourcesJar()
sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21
}
""")
​with open("src/main/resources/fabric.mod.json", "w") as f:
f.write("""{
"schemaVersion": 1,
"id": "pojavhud",
"version": "${version}",
"name": "PojavHUD (1.21.9 - 1.21.11)",
"description": "Item overlay for PojavLauncher + Built-in PvP Kit Mod.",
"authors": ["PojavHUD"],
"license": "MIT",
"icon": "assets/pojavhud/icon.png",
"environment": "client",
"entrypoints": {
"client": ["com.pojavhud.PojavHudClient"],
"modmenu": ["com.pojavhud.ModMenuIntegration"]
},
"depends": {
"fabricloader": ">=0.16.0",
"minecraft": ">=1.21.9 <=1.21.11",
"java": ">=21",
"fabric-api": "*"
}
}
""")
​with open("src/main/resources/assets/pojavhud/lang/en_us.json", "w") as f:
f.write("""{
"key.pojavhud.toggle": "Toggle PojavHUD",
"key.pojavhud.editor": "Open PojavHUD Editor",
"key.pojavhud.hidemenus": "Toggle PojavHUD Hide in Menus",
"key.pojavhud.kitmenu": "Open PojavHUD Kit Menu",
"category.pojavhud": "PojavHUD",
"key.category.pojavhud.main": "PojavHUD"
}
""")
​# Generate Ninja Rowlet Icon
w, h = 128, 128
px = bytearray(w * h * 4)
def sp(x, y, r, g, b):
if 0 <= x < w and 0 <= y < h:
i = (y * w + x) * 4
px[i:i+4] = bytes((r, g, b, 255))
for y in range(h):
for x in range(w):
sp(x, y, 223, 186, 150)
d = ((x - 64) / 46.0)2 + ((y - 68) / 38.0)2
if d <= 1.08:
sp(x, y, *(107, 58, 30) if d > 0.95 else ((248, 245, 240) if y > 90 else (217, 174, 134)))
dl, dr = ((x - 48) / 20.0)2 + ((y - 68) / 18.0)2, ((x - 80) / 20.0)2 + ((y - 68) / 18.0)2
if y >= 50 and (dl <= 1.0 or dr <= 1.0):
sp(x, y, *(107, 58, 30) if (dl > 0.86 and dr > 0.86) else (252, 249, 244))
if ((x - 42) / 7.5)2 + ((y - 76) / 3.8)2 <= 1.0 or ((x - 86) / 7.5)2 + ((y - 76) / 3.8)2 <= 1.0:
sp(x, y, 242, 139, 130)
if (36 <= x <= 50 and abs(y - 67) <= 1) or (78 <= x <= 92 and abs(y - 67) <= 1):
sp(x, y, 92, 51, 23)
if 57 <= x <= 71 and 66 <= y <= 81 and abs(x - 64) <= (81 - y) * 0.48:
sp(x, y, 217, 107, 67)
bl, br = ((x - 52) / 13.0)2 + ((y - 90) / 6.5)2, ((x - 76) / 13.0)2 + ((y - 90) / 6.5)2
if bl <= 1.0 or br <= 1.0:
sp(x, y, *(60, 45, 30) if (bl > 0.78 and br > 0.78) else (61, 139, 116))
if 36 <= y <= 52 and abs(x - 64) <= 42:
sp(x, y, (65, 42, 32) if (y in (36, 37, 51, 52) or abs(x - 64) >= 40) else (75, 91, 171))
if 37 <= y <= 51 and 40 <= x <= 84:
sp(x, y, (95, 82, 28) if (y in (37, 51) or x in (40, 84)) else ((75, 65, 20) if 2.2 <= math.hypot(x - 62, y - 44) <= 4.0 else (204, 198, 104)))
def chk(t, d):
return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
raw = bytearray()
for y in range(h):
raw.append(0)
raw.extend(px[yw4:(y+1)w4])
with open("src/main/resources/assets/pojavhud/icon.png", "wb") as f:
f.write(b"\x89PNG\r\n\x1a\n" + chk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chk(b"IDAT", zlib.compress(bytes(raw), 9)) + chk(b"IEND", b""))
​with open("src/main/java/com/pojavhud/ModMenuIntegration.java", "w") as f:
f.write("""package com.pojavhud;
import com.terraformersmc.modmenu.api.ConfigScreenFactory;
import com.terraformersmc.modmenu.api.ModMenuApi;
public class ModMenuIntegration implements ModMenuApi {
@Override
public ConfigScreenFactory<?> getModConfigScreenFactory() {
return parent -> new EditorScreen();
}
}
""")
