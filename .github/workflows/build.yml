cmdField.setText("/mkit preview " + selKit);
this.addDrawableChild(cmdField);
this.addDrawableChild(ButtonWidget.builder(Text.literal("§eRun Cmd"), b -> status = KitCommand.executeFromMenu(client, cmdField.getText(), this)).dimensions(cx + 64, cy, 58, 18).build());
this.addDrawableChild(ButtonWidget.builder(Text.literal("Creative"), b -> status = KitCommand.executeFromMenu(client, "/gamemode creative", this)).dimensions(cx + 126, cy, 54, 18).build());
}
@Override
public void render(DrawContext ctx, int mx, int my, float delta) {
ctx.fill(0, 0, this.width, this.height, 0xB0101218);
super.render(ctx, mx, my, delta);
int cx = this.width / 2, gx = cx - 81, gy = 60;
ctx.drawCenteredTextWithShadow(this.textRenderer, "§6§lPojavHUD Kit Manager & Preview", cx, 9, 0xFFFFFF);
var k = KitManager.data.kits.get(selKit);
ctx.drawCenteredTextWithShadow(this.textRenderer, "§e" + selKit.toUpperCase(Locale.ROOT) + " §7— " + (k != null ? k.description : ""), cx, 47, 0xCCCCCC);
ItemStack hov = ItemStack.EMPTY;
int[] eq = {39, 38, 37, 36, 40};
String[] lb = {"H", "C", "L", "B", "O"};
for (int i = 0; i < 5; i++) {
ItemStack s = slot(ctx, cx - 55 + i * 22, gy, eq[i], lb[i], mx, my, 0x60384860);
if (!s.isEmpty()) hov = s;
}
for (int r = 0; r < 3; r++) for (int c = 0; c < 9; c++) {
ItemStack s = slot(ctx, gx + c * 18, gy + 22 + r * 18, 9 + r * 9 + c, null, mx, my, 0x55222630);
if (!s.isEmpty()) hov = s;
}
for (int c = 0; c < 9; c++) {
ItemStack s = slot(ctx, gx + c * 18, gy + 80, c, String.valueOf(c + 1), mx, my, 0x702C3E50);
if (!s.isEmpty()) hov = s;
}
ctx.drawCenteredTextWithShadow(this.textRenderer, status, cx, this.height - 58, 0xFFFFFF);
if (!hov.isEmpty()) ctx.drawItemTooltip(this.textRenderer, hov, mx, my);
}
private ItemStack slot(DrawContext ctx, int x, int y, int idx, String hint, int mx, int my, int bg) {
boolean h = mx >= x && mx < x + 18 && my >= y && my < y + 18;
ctx.fill(x, y, x + 17, y + 17, h ? 0x9066AAFF : bg);
ctx.drawStrokedRectangle(x, y, 17, 17, h ? 0xFFFFFF00 : 0x60FFFFFF);
ItemStack st = preview.getOrDefault(idx, ItemStack.EMPTY);
if (st != null && !st.isEmpty()) {
ctx.drawItem(st, x + 1, y + 1);
ctx.drawStackOverlay(this.textRenderer, st, x + 1, y + 1);
return h ? st : ItemStack.EMPTY;
} else if (hint != null) ctx.drawCenteredTextWithShadow(this.textRenderer, hint, x + 9, y + 5, 0x55FFFFFF);
return ItemStack.EMPTY;
}
@Override
public void close() {
if (parent != null && client != null) client.setScreen(parent);
else { PojavHudClient.editorOpen = false; super.close(); }
}
@Override
public boolean shouldPause() { return false; }
}
